<!doctype html>
<html lang="en" style="background:#050912">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>RSSHU</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050912;
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 20%, rgb(56 189 248 / 0.12), transparent 42%),
          radial-gradient(circle at 80% 80%, rgb(52 211 153 / 0.08), transparent 38%),
          linear-gradient(160deg, #050912 0%, #0b1326 55%, #050912 100%);
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        user-select: none;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.1rem;
        background: rgb(56 189 248 / 0.12);
        border: 1px solid rgb(56 189 248 / 0.25);
        box-shadow: 0 0 32px rgb(56 189 248 / 0.12);
      }

      .logo svg {
        width: 2rem;
        height: 2rem;
        color: #38bdf8;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      p {
        font-size: 0.875rem;
        color: rgb(248 250 252 / 0.65);
      }

      .bar {
        width: 10rem;
        height: 3px;
        border-radius: 999px;
        background: rgb(248 250 252 / 0.08);
        overflow: hidden;
        margin-top: 0.25rem;
      }

      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, #34d399);
        animation: slide 1.1s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body style="background:#050912">
    <div class="wrap">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <path d="M6 21h12"></path>
          <path d="M8 7h.01"></path>
          <path d="M12 7h4"></path>
          <path d="M8 11h8"></path>
        </svg>
      </div>
      <div>
        <h1>RSSHU</h1>
        <p>SSH / SFTP client</p>
      </div>
      <div class="bar" aria-hidden="true"><span></span></div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const invoke = window.__TAURI__?.core?.invoke;
        if (invoke) {
          invoke("show_splashscreen").catch(() => {});
        }
      });
    </script>
  </body>
</html>
